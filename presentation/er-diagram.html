<script>
  document.getElementById('dl').addEventListener('click', function () {
    var svg = document.getElementById('er');
    var scale = 2;                       // PNG у подвійному розмірі: 3200 × 1800
    var w = 1600, h = 900;

    // 1. Перетворюємо SVG на текст і пакуємо його в адресу картинки
    var source = new XMLSerializer().serializeToString(svg);
    var url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(source);

    // 2. Завантажуємо цей текст як звичайну картинку
    var img = new Image();
    img.onload = function () {
      // 3. Малюємо картинку на полотні canvas
      var canvas = document.createElement('canvas');
      canvas.width = w * scale;
      canvas.height = h * scale;
      var ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

      // 4. Полотно віддає PNG, а посилання одразу його зберігає
      var a = document.createElement('a');
      a.download = 'er-diagram.png';
      a.href = canvas.toDataURL('image/png');
      a.click();
    };
    img.onerror = function () {
      alert('PNG не створився. Відкрийте файл у Chrome, Edge або Firefox.');
    };
    img.src = url;
  });
</script>
